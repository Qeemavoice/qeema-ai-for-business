<Directory /var/www/html/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Traefik terminates TLS before forwarding requests to Apache. Expose the
# original scheme to Laravel/Symfony so redirects and generated URLs stay HTTPS.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerTokens Prod
ServerSignature Off

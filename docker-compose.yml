name: qeemavoice-local

services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads

  db:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qeemavoice_local
      MYSQL_USER: qeemavoice
      MYSQL_PASSWORD: qeemavoice_local_password
      MYSQL_ROOT_PASSWORD: qeemavoice_local_root_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pqeemavoice_local_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["workers"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads

  scheduler:
    profiles: ["workers"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads

  websocket:
    profiles: ["workers"]
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "websockets:serve", "--port=6002"]
    ports:
      - "127.0.0.1:6002:6002"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  app-storage:


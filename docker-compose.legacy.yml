name: qeemavoice-legacy

services:
  db:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - legacy-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 60

  v2:
    build:
      context: .
      dockerfile: docker/legacy/Dockerfile
    image: qeemavoice-legacy-php:8.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://qeemavoice.com
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: qeemavoice_v2
      DB_USERNAME: qema_legacy
      DB_PASSWORD: ${LEGACY_DB_PASSWORD}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    volumes:
      - ./v2:/var/www/html
    labels:
      - traefik.enable=true
      - traefik.http.routers.qeemavoice-v2.rule=Host(`v2.qeemavoice.com`) || Host(`qeemavoice.com`) || Host(`www.qeemavoice.com`)
      - traefik.http.routers.qeemavoice-v2.entrypoints=websecure
      - traefik.http.routers.qeemavoice-v2.tls=true
      - traefik.http.routers.qeemavoice-v2.tls.certresolver=letsencrypt
      - traefik.http.routers.qeemavoice-v2.middlewares=qeemavoice-www-redirect
      - traefik.http.middlewares.qeemavoice-www-redirect.redirectregex.regex=^https?://www\.qeemavoice\.com/(.*)
      - traefik.http.middlewares.qeemavoice-www-redirect.redirectregex.replacement=https://qeemavoice.com/$${1}
      - traefik.http.middlewares.qeemavoice-www-redirect.redirectregex.permanent=true
      - traefik.http.services.qeemavoice-v2.loadbalancer.server.port=80

  v2-worker:
    image: qeemavoice-legacy-php:8.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://v2.qeemavoice.com
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: qeemavoice_v2
      DB_USERNAME: qema_legacy
      DB_PASSWORD: ${LEGACY_DB_PASSWORD}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    volumes:
      - ./v2:/var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]

  v3:
    image: qeemavoice-legacy-php:8.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://v3.qeemavoice.com
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: qeemavoice_prod
      DB_USERNAME: qema_legacy
      DB_PASSWORD: ${LEGACY_DB_PASSWORD}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
    volumes:
      - ./v3:/var/www/html
    labels:
      - traefik.enable=true
      - traefik.http.routers.qeemavoice-v3.rule=Host(`v3.qeemavoice.com`)
      - traefik.http.routers.qeemavoice-v3.entrypoints=websecure
      - traefik.http.routers.qeemavoice-v3.tls=true
      - traefik.http.routers.qeemavoice-v3.tls.certresolver=letsencrypt
      - traefik.http.services.qeemavoice-v3.loadbalancer.server.port=80

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - legacy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  legacy-mysql-data:
  legacy-redis-data:

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد قيمة — عرض تجريبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(160deg,#2A003F 0%,#6500A5 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  .box{max-width:620px}
  h1{font-size:30px;line-height:1.4;margin:0 0 12px}
  h1 span{color:#F5A623}
  p{color:#E4D6F0;margin:0 0 24px;line-height:1.8}
  button{font-family:inherit;border:none;border-radius:12px;padding:13px 26px;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#F5A623,#E08A00);color:#2A003F}
  small{display:block;margin-top:18px;color:#B78AD6;font-size:12px}
</style>
</head>
<body>
  <div class="box">
    <h1>اختر <span>الصوت المناسب</span> لمشروعك خلال دقائق</h1>
    <p>أخبر مساعد قيمة عن مشروعك، وسيرشّح لك أنسب المعلقين، ويُسمعك معاينة بصوت المعلق على نصك.</p>
    <button onclick="QeemaChat.open()">ابدأ مع مساعد قيمة</button>
    <small>عرض تجريبي ببيانات وهمية — لا يتصل بالخادم ولا يولّد أصواتًا حقيقية</small>
  </div>
  <script src="../public/qv-chat/qv-chat.js" data-mock="true" data-whatsapp="966500000000" defer></script>
</body>
</html>

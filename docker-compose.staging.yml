name: qeemavoice-staging

services:
  app:
    build:
      context: .
    image: qeemavoice-staging-app:latest
    restart: unless-stopped
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
      - ./public/uploads:/var/www/html/public/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.qeemavoice-staging.rule=Host(`staging.qeemavoice.com`)
      - traefik.http.routers.qeemavoice-staging.entrypoints=websecure
      - traefik.http.routers.qeemavoice-staging.tls=true
      - traefik.http.routers.qeemavoice-staging.tls.certresolver=letsencrypt
      - traefik.http.services.qeemavoice-staging.loadbalancer.server.port=80

  db:
    image: mysql:8.0.44
    restart: unless-stopped
    env_file:
      - .env.staging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  app-storage:
